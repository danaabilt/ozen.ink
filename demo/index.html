<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖZEN — демо MVP</title>
<meta name="description" content="ÖZEN — демо-версия MVP: профиль ребёнка 10–14 лет глазами родителя. Прототип с демо-вопросами.">
<meta name="theme-color" content="#0E7C7B">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
:root{--teal:#0E7C7B;--teal-d:#0A5F5E;--gold:#C08A2D;--ink:#14231F;--paper:#FBFAF7;--line:#E3E0D8;--mute:#4A5A55;--card:#FFFFFF;--tag:#F1E4C8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#ECE9E1;color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:16px;line-height:1.45}
.shell{max-width:460px;min-height:100%;margin:0 auto;background:var(--paper);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.logo{font-family:'Unbounded',sans-serif;font-weight:600;font-size:18px;color:var(--teal);text-decoration:none}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;padding:4px 8px;border-radius:4px;background:var(--tag);color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding:24px 20px 28px}
h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:24px;line-height:1.25;margin:0}
h1.big{font-size:28px;margin-top:16px}
p{margin:0}
.mute{color:var(--mute);font-size:14px}
.small{font-size:13px;color:var(--mute)}
.card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.card b{font-weight:600}
.grow{flex:1}
button{font-family:inherit;cursor:pointer}
.btn{min-height:52px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-size:17px;font-weight:600;width:100%}
.btn:hover{background:var(--teal-d)}
.btn[disabled]{background:#D5D2C9;color:var(--mute);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal);min-height:48px;font-size:16px}
.btn.demo{background:var(--tag);color:var(--ink);border:2px dashed var(--ink);font-size:16px}
.link{min-height:44px;border:none;background:transparent;color:var(--teal);font-size:15px;font-weight:500;width:100%}
label.f{display:flex;flex-direction:column;gap:8px;font-weight:500;font-size:14px}
input[type=tel],input[type=email],select{min-height:48px;padding:0 14px;border:1px solid #9AA6A1;border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);width:100%}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
label.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--teal);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;font-size:15px;border:1px solid #9AA6A1;background:#fff;color:var(--ink)}
.chip[aria-pressed=true]{border:2px solid var(--teal);background:var(--teal);color:#fff;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--teal)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--tag)}
.q{font-size:20px;font-weight:600;line-height:1.35}
.opt{min-height:50px;padding:0 16px;border-radius:12px;font-size:16px;text-align:left;border:1px solid #9AA6A1;background:#fff;color:var(--ink);width:100%}
.opt[aria-pressed=true]{border:2px solid var(--teal);background:#E2F0EF;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.steps div{display:flex;gap:12px;align-items:center}
.dot{width:12px;height:12px;border-radius:6px;background:var(--teal);flex-shrink:0}
.dot.cur{background:transparent;border:2px solid var(--teal)}
.dot.off{background:transparent;border:2px solid #9AA6A1}
.rows{border:1px solid var(--line);border-radius:12px;background:#fff}
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #EFEDE6}
.row:last-child{border-bottom:none}
.row .n{font-weight:600;width:16px;flex-shrink:0}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--teal)}
.att{border-color:#9AA6A1;background:#F4F2EC}
svg{display:block;width:100%;height:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{padding:14px 20px 20px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);text-align:center}
footer a{color:var(--teal)}
.gold{color:var(--gold);font-weight:600}
</style>
</head>
<body>
<div class="shell">
<header>
<a class="logo" href="https://ozen.ink" aria-label="ÖZEN — на сайт">ÖZEN</a>
<div class="meta"><span id="stepLabel">Шаг 1 из 6</span><span class="tag">ДЕМО</span></div>
</header>
<main id="app" aria-live="polite"></main>
<footer>Демо-версия. ÖZEN не ставит диагнозов и не заменяет специалиста. Ответы хранятся только на этом устройстве. <a href="https://ozen.ink">О проекте</a></footer>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'ozen-demo-v1';
  var BASE = { step: 'intro', c1: false, c2: false, c3: false, year: '', interests: {}, qi: 0, answers: {} };
  var QS = [
    { axis: 0, kind: 'likert', text: 'Разбирая новое, ребёнок сначала хочет понять общую идею, а потом детали.' },
    { axis: 0, kind: 'likert', text: 'Ребёнок может долго удерживать внимание на задаче, которая ему интересна.' },
    { axis: 1, kind: 'likert', text: 'Когда ребёнок расстроен, он может сказать словами, что чувствует.' },
    { axis: 1, kind: 'likert', text: 'После неудачи ребёнок довольно быстро возвращается к делу.' },
    { axis: 2, kind: 'likert', text: 'Ребёнок берётся за занятия потому, что ему самому интересно, а не ради оценки или похвалы.' },
    { axis: 2, kind: 'likert', text: 'Ребёнку важно самому решать, что и как делать.' },
    { axis: 3, kind: 'likert', text: 'В компании сверстников ребёнок сам предлагает, чем заняться.' },
    { axis: 3, kind: 'likert', text: 'В новой обстановке и с новыми людьми ребёнок быстро осваивается.' },
    { axis: 4, kind: 'freq', text: 'Ребёнок говорил, что ему ничего не интересно или что он устал.' },
    { axis: 4, kind: 'freq', text: 'Ребёнок заметно волновался перед школой или важными событиями.' }
  ];
  var AXES = ['Когнитивный профиль', 'Эмоциональная архитектура', 'Ценностный вектор', 'Поведенческая динамика', 'Зона внимания', 'Зона потенциала'];
  var LIKERT = ['Совсем не похоже', 'Скорее не похоже', 'Когда как', 'Скорее похоже', 'Очень похоже'];
  var FREQ = ['Никогда', 'Редко', 'Иногда', 'Часто', 'Почти всегда'];
  var INTERESTS = ['Наука и эксперименты', 'Программирование', 'Рисование и дизайн', 'Музыка', 'Спорт', 'Языки', 'Театр и сцена', 'Конструирование'];
  var STEP_NO = { intro: 1, reg: 2, consent: 3, child: 4, quiz: 5, review: 5, hex: 6 };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) { return Object.assign(clone(BASE), JSON.parse(raw)); }
    } catch (e) { /* хранилище недоступно — работаем в памяти */ }
    return clone(BASE);
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* нет хранилища */ }
  }
  function wipe() {
    try { window.localStorage.removeItem(KEY); } catch (e) { /* нет хранилища */ }
    s = clone(BASE);
  }
  var s = load();
  if (!STEP_NO[s.step]) { s = clone(BASE); }

  function pt(i, f) {
    var a = (-90 + 60 * i) * Math.PI / 180;
    return [170 + 95 * f * Math.cos(a), 155 + 95 * f * Math.sin(a)];
  }
  function ring(f) {
    var out = [];
    for (var i = 0; i < 6; i++) { var p = pt(i, f); out.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
    return out.join(' ');
  }
  function score() {
    var idx = [0, 1, 2, 3].map(function (k) {
      var sum = 0, n = 0;
      QS.forEach(function (q, i) { if (q.axis === k && s.answers[i]) { sum += s.answers[i]; n++; } });
      return n ? ((sum / n - 1) / 4) * 100 : 50;
    });
    var flags = 0;
    QS.forEach(function (q, i) { if (q.kind === 'freq' && s.answers[i] >= 4) { flags++; } });
    return { idx: idx, flags: flags };
  }
  function word(v) { return v >= 67 ? 'Проявляется ярко' : (v >= 34 ? 'Проявляется умеренно' : 'Проявляется мягко'); }

  var views = {
    intro: function () {
      return '<h1 class="big">Карта, а не рейтинг</h1>' +
        '<p style="font-size:17px">ÖZEN помогает родителю увидеть целостный профиль ребёнка 10–14 лет и понять, что делать дальше.</p>' +
        '<div class="card"><b>Что важно знать заранее</b>' +
        '<p>Это не тест и не диагностика. На вопросы отвечаете вы, ребёнок ничего не проходит.</p>' +
        '<p>Здесь нет общего балла и сравнения с другими детьми.</p>' +
        '<p>В настоящем продукте профиль перед показом проверяет специалист.</p></div>' +
        '<div class="note">Это демо-версия: вопросы условные, результат нельзя считать профилем ребёнка.</div>' +
        '<div class="grow"></div>' +
        '<button class="btn" data-go="reg">Начать</button>' +
        '<p class="small" style="text-align:center">Часть экосистемы OZI<span class="gold">.</span>ÖZEN · Астана</p>';
    },
    reg: function () {
      return '<h1>Регистрация родителя</h1>' +
        '<p>Вход по номеру телефона или электронной почте. Ребёнку отдельный вход не нужен.</p>' +
        '<label class="f">Телефон<input type="tel" autocomplete="off" placeholder="+7 7__ ___ __ __"></label>' +
        '<label class="f">Электронная почта<input type="email" autocomplete="off" placeholder="name@example.com"></label>' +
        '<p class="small">В демо код не отправляется, а эти поля нигде не сохраняются. Можно оставить пустыми.</p>' +
        '<div class="grow"></div>' +
        '<button class="btn" data-go="consent">Продолжить</button>' +
        '<button class="link" data-go="intro">Назад</button>';
    },
    consent: function () {
      var blocked = !(s.c1 && s.c2);
      return '<h1>Согласие</h1>' +
        '<p>Данные о ребёнке принадлежат семье. Согласие можно отозвать, а данные удалить.</p>' +
        '<label class="chk"><input type="checkbox" data-chk="c1"' + (s.c1 ? ' checked' : '') + '><span>Согласен(на) на обработку ответов в этой демо-версии. <span class="mute">Обязательно</span></span></label>' +
        '<label class="chk"><input type="checkbox" data-chk="c2"' + (s.c2 ? ' checked' : '') + '><span>Понимаю, что ÖZEN не ставит диагнозов и не заменяет специалиста. <span class="mute">Обязательно</span></span></label>' +
        '<label class="chk"><input type="checkbox" data-chk="c3"' + (s.c3 ? ' checked' : '') + '><span>Готов(а) в будущем делиться обезличенными ответами для исследования. <span class="mute">По желанию</span></span></label>' +
        '<p class="small">В демо ответы никуда не передаются. Юридический текст согласия появится перед пилотом.</p>' +
        '<div class="grow"></div>' +
        '<button class="btn" data-go="child"' + (blocked ? ' disabled' : '') + '>Продолжить</button>' +
        '<button class="link" data-go="reg">Назад</button>';
    },
    child: function () {
      var years = ['2016', '2015', '2014', '2013', '2012'];
      var opts = '<option value="">Выберите год</option>' + years.map(function (y) {
        return '<option value="' + y + '"' + (s.year === y ? ' selected' : '') + '>' + y + '</option>';
      }).join('');
      var chips = INTERESTS.map(function (label, i) {
        return '<button type="button" class="chip" data-chip="' + i + '" aria-pressed="' + (s.interests[label] ? 'true' : 'false') + '">' + label + '</button>';
      }).join('');
      return '<h1>Профиль ребёнка</h1>' +
        '<p>Имя, фото и точную дату рождения не спрашиваем.</p>' +
        '<label class="f">Год рождения<select data-year>' + opts + '</select></label>' +
        '<p class="small">Сейчас ÖZEN рассчитан на возраст 10–14 лет.</p>' +
        '<div><p style="font-weight:500;font-size:14px;margin-bottom:10px">Чем ребёнок интересуется сейчас</p><div class="chips">' + chips + '</div></div>' +
        '<div class="grow"></div>' +
        '<button class="btn" data-go="quiz"' + (s.year ? '' : ' disabled') + '>К вопросам</button>' +
        '<button class="link" data-go="consent">Назад</button>';
    },
    quiz: function () {
      var qi = Math.min(s.qi, QS.length - 1);
      var q = QS[qi];
      var labels = q.kind === 'freq' ? FREQ : LIKERT;
      var opts = labels.map(function (label, i) {
        return '<button type="button" class="opt" data-ans="' + (i + 1) + '" aria-pressed="' + (s.answers[qi] === i + 1 ? 'true' : 'false') + '">' + label + '</button>';
      }).join('');
      return '<div><div style="display:flex;justify-content:space-between" class="small"><span>' + AXES[q.axis] + '</span><span>Вопрос ' + (qi + 1) + ' из ' + QS.length + '</span></div>' +
        '<div class="bar" style="margin-top:8px"><i style="width:' + Math.round(qi / QS.length * 100) + '%"></i></div></div>' +
        '<div class="note">Демо-вопросы. Это не методика ÖZEN: настоящий банк вопросов подключается после научной сверки.</div>' +
        '<p class="small">' + (q.kind === 'freq' ? 'За последний месяц' : 'Насколько это похоже на вашего ребёнка') + '</p>' +
        '<p class="q">' + q.text + '</p>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="grow"></div>' +
        '<button class="link" data-back>Назад</button>';
    },
    review: function () {
      return '<h1>Черновик у специалиста</h1>' +
        '<p>Ответы приняты. В настоящем продукте черновик профиля сначала смотрит специалист ÖZEN, и только после этого его видит семья.</p>' +
        '<div class="card steps">' +
        '<div><span class="dot"></span><span>Анкета заполнена</span></div>' +
        '<div><span class="dot"></span><span>Черновик профиля собран</span></div>' +
        '<div><span class="dot cur"></span><b>Проверка специалистом</b></div>' +
        '<div><span class="dot off"></span><span class="mute">Профиль открыт семье</span></div></div>' +
        '<p class="mute">В демо специалиста нет: этот шаг можно пройти кнопкой ниже.</p>' +
        '<div class="grow"></div>' +
        '<button class="btn demo" data-go="hex">Демо: специалист подтвердил</button>';
    },
    hex: function () {
      var r = score();
      var fr = r.idx.map(function (v) { return 0.15 + 0.85 * v / 100; }).concat([0.5, 0.5]);
      var pts = fr.map(function (f, i) { return pt(i, f); });
      var poly = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
      var grid = [0, 1, 2, 3, 4, 5].map(function (i) {
        var p = pt(i, 1);
        return '<line x1="170" y1="155" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#D5D2C9"/>';
      }).join('');
      var dots = pts.map(function (p, i) {
        return i < 4
          ? '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="#0E7C7B"/>'
          : '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="#fff" stroke="#0E7C7B" stroke-width="2"/>';
      }).join('');
      var nums = [0, 1, 2, 3, 4, 5].map(function (i) {
        var p = pt(i, 1.17);
        return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 5).toFixed(1) + '" font-size="14" font-weight="600" fill="#14231F" text-anchor="middle">' + (i + 1) + '</text>';
      }).join('');
      var rows = AXES.map(function (name, i) {
        var text = '';
        if (i < 4) { text = word(r.idx[i]); }
        if (i === 4) { text = r.flags > 0 ? 'Отметок: ' + r.flags + '. Без баллов и ярлыков' : 'Отметок нет'; }
        if (i === 5) { text = 'Определит специалист по пяти осям'; }
        return '<div class="row"><span class="n">' + (i + 1) + '</span><div><b>' + name + '</b><div class="mute">' + text + '</div></div></div>';
      }).join('');
      var att = r.flags >= 2
        ? '<div class="card att"><b>Есть зоны внимания</b><p style="font-size:14px">Некоторые ответы стоит обсудить со специалистом. Это не оценка и не диагноз.</p></div>'
        : '';
      return '<div><h1>Стартовый гексагон</h1><p class="mute" style="margin-top:4px">Ребёнок ' + s.year + ' г. р. · демо-результат</p></div>' +
        '<div class="card" style="padding:8px"><svg viewBox="0 0 340 310" role="img" aria-label="Гексагон профиля по шести осям">' +
        '<polygon points="' + ring(1) + '" fill="none" stroke="#9AA6A1"/>' +
        '<polygon points="' + ring(0.66) + '" fill="none" stroke="#D5D2C9"/>' +
        '<polygon points="' + ring(0.33) + '" fill="none" stroke="#D5D2C9"/>' + grid +
        '<polygon points="' + poly + '" fill="rgba(14,124,123,0.18)" stroke="#0E7C7B" stroke-width="2" stroke-linejoin="round"/>' + dots + nums +
        '</svg></div>' +
        '<p class="small">Форма показывает, как проявляется каждая ось. Дальше от центра не значит «лучше». Общего балла нет.</p>' +
        '<div class="rows">' + rows + '</div>' +
        '<div class="card"><b>Уверенность профиля: начальная</b><div class="segs"><i class="on"></i><i></i><i></i><i></i></div>' +
        '<p class="mute">1 источник из 4: анкета родителя. Досье, наблюдение вместе с ребёнком и характеристики педагогов сделают профиль точнее.</p></div>' + att +
        '<div class="card"><b>Что будет дальше в ÖZEN</b><p class="mute">Полный профиль, маршрут развития, дневник и досье. Эти разделы в демо пока не открыты.</p></div>' +
        '<button class="btn ghost" data-restart>Пройти заново</button>' +
        '<button class="link" data-wipe>Удалить мои ответы с устройства</button>';
    }
  };

  var app = document.getElementById('app');
  var stepLabel = document.getElementById('stepLabel');
  function render() {
    stepLabel.textContent = 'Шаг ' + STEP_NO[s.step] + ' из 6';
    app.innerHTML = views[s.step]();
    window.scrollTo(0, 0);
    save();
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) { return; }
    if (t.dataset.go) {
      if (t.dataset.go === 'quiz') { s.qi = 0; }
      s.step = t.dataset.go; render(); return;
    }
    if (t.dataset.chip !== undefined) {
      var label = INTERESTS[Number(t.dataset.chip)];
      s.interests[label] = !s.interests[label];
      t.setAttribute('aria-pressed', s.interests[label] ? 'true' : 'false');
      save(); return;
    }
    if (t.dataset.ans) {
      var qi = Math.min(s.qi, QS.length - 1);
      s.answers[qi] = Number(t.dataset.ans);
      if (qi + 1 < QS.length) { s.qi = qi + 1; } else { s.step = 'review'; }
      render(); return;
    }
    if (t.dataset.back !== undefined) {
      if (s.qi > 0) { s.qi -= 1; } else { s.step = 'child'; }
      render(); return;
    }
    if (t.dataset.restart !== undefined || t.dataset.wipe !== undefined) {
      wipe(); render();
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.chk) { s[t.dataset.chk] = t.checked; render(); return; }
    if (t.dataset.year !== undefined) { s.year = t.value; render(); }
  });

  render();
})();
</script>
</body>
</html>
