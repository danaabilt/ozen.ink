<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖZEN — рабочее место специалиста</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14231F">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
:root{--teal:#0E7C7B;--gold:#C08A2D;--ink:#14231F;--paper:#FBFAF7;--line:#E3E0D8;--mute:#4A5A55;--tag:#F1E4C8;--edge:#9AA6A1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-family:'Unbounded',sans-serif;font-weight:600}
header span{font-size:13px;opacity:.8}
main{max-width:860px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:18px}
h1{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:600;margin:0}
h2{font-size:17px;margin:0}
p{margin:0}
.mute{color:var(--mute);font-size:14px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:12px}
.note{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--tag)}
textarea,input{width:100%;padding:12px 14px;border:1px solid var(--edge);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
button{font:inherit;font-weight:600;min-height:48px;padding:0 18px;border:none;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid #EFEDE6;vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.flag td{background:#F4F2EC;font-weight:600}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:12px;background:#E2F0EF;color:#0A5F5E;margin:0 4px 4px 0}
svg{display:block;width:100%;height:auto}
ul{margin:0;padding-left:20px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><b>ÖZEN · специалист</b><span>Служебная страница. Данные не покидают этот браузер.</span></header>
<main>
  <h1>Проверка черновика профиля</h1>
  <div class="card">
    <label>Код черновика от родителя
      <textarea class="code" id="in" rows="4" placeholder="OZP1…" autocapitalize="off" spellcheck="false"></textarea></label>
    <div><button id="read">Открыть черновик</button></div>
    <p class="mute" id="err" role="alert"></p>
  </div>
  <div id="out" hidden></div>
</main>
<script src="../method.js"></script>
<script src="../core.js"></script>
<script>
(function () {
  'use strict';
  var M = window.OZEN_METHOD, C = window.OZEN_CORE, P = null;
  var out = document.getElementById('out'), err = document.getElementById('err');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function axisName(k) { return M.axes.filter(function (a) { return a.key === k; })[0].name; }

  document.getElementById('read').addEventListener('click', function () {
    P = C.unpackProfile(document.getElementById('in').value);
    if (!P) { err.textContent = 'Код не читается. Проверьте, что он скопирован целиком и начинается с OZP1.'; out.hidden = true; return; }
    err.textContent = '';
    var idx = C.indices(P.ans), fl = C.flags(P.ans), lv = C.level(fl);
    var axes = C.AX4.map(function (k, i) {
      var b = C.band(idx[i]);
      return '<tr><td>' + axisName(k) + '</td><td class="n">' + (idx[i] === null ? '—' : Math.round(idx[i])) + '</td><td>' + (b ? M.texts[k][b][0] : 'нет ответов') + '</td><td>' +
        C.cats(P.ans, k).map(function (x) { return '<span class="pill">' + x + '</span>'; }).join('') + '</td></tr>';
    }).join('');
    var rows = M.questions.map(function (q) {
      var v = P.ans[q.id], txt = '—';
      if (v) { txt = q.t === 'c' ? q.o[v - 1][0] : (q.t === 'f' ? M.freq[v - 1] : M.likert[v - 1]); }
      var flag = q.t === 'f' && v >= M.flagFrom;
      return '<tr' + (flag ? ' class="flag"' : '') + '><td>' + q.id + (q.t === 'r' ? ' (обр.)' : '') + '</td><td>' + q.q + '</td><td>' + txt + '</td></tr>';
    }).join('');
    var ints = (P.interests || []).map(function (i) { return M.interests[i] ? M.interests[i][0] : ''; }).filter(Boolean).join(', ') || 'не указаны';
    out.hidden = false;
    out.innerHTML =
      '<div class="card"><h2>Черновик ' + esc(P.pid) + '</h2><p>Год рождения: <b>' + esc(P.year) + '</b> · Интересы: ' + esc(ints) + ' · Ответов: ' + C.answered(P.ans) + ' из ' + M.questions.length + '</p>' +
      (M.status !== 'approved' ? '<div class="note">Методика: ' + esc(M.version) + '. Пороги и формулировки не утверждены, индексы ниже служат только ориентиром для вашего суждения.</div>' : '') +
      '<div class="grid"><div>' + C.hexSvg(idx) + '</div><div><table><tr><th>Ось</th><th>Индекс</th><th>Уровень</th><th>Категории</th></tr>' + axes + '</table>' +
      '<p style="margin-top:10px">Зона внимания: <b>отметок ' + fl + ', уровень ' + lv + '</b>' + (lv >= 2 ? '. Родителю уже показан экран «Помощь» с рекомендацией обратиться к специалисту.' : '.') + '</p></div></div>' +
      '<p class="mute">Индекс оси = ((среднее − 1) / 4) × 100 по шкальным пунктам с учётом обратных. Индексы видит только специалист; семье показываются слова, без чисел и без общего балла.</p></div>' +
      '<div class="card"><h2>Ответы</h2><table><tr><th>Код</th><th>Пункт</th><th>Ответ</th></tr>' + rows + '</table></div>' +
      '<div class="card"><h2>Решение специалиста</h2>' +
      '<p class="mute">Перед подтверждением проверьте:</p><ul class="mute"><li>в тексте нет диагнозов, названий расстройств и клинических терминов;</li><li>нет сравнения с другими детьми и общей оценки;</li><li>зона внимания не толкуется, только рекомендация обратиться к специалисту;</li><li>в тексте нет имён и других сведений, по которым можно узнать ребёнка.</li></ul>' +
      '<label>Зона потенциала: линия 1<input id="l1" maxlength="60" placeholder="Например: исследование и эксперимент"></label>' +
      '<label>Зона потенциала: линия 2 (необязательно)<input id="l2" maxlength="60"></label>' +
      '<label>Стратегический вектор<textarea id="vec" rows="2" maxlength="300" placeholder="Одно–два предложения: куда стоит дать больше пространства."></textarea></label>' +
      '<label>Комментарий семье (необязательно)<textarea id="nt" rows="3" maxlength="500"></textarea></label>' +
      '<div><button id="mk">Подтвердить и сформировать код открытия</button></div>' +
      '<div id="res" hidden><label>Код открытия для родителя<textarea class="code" id="oc" rows="4" readonly></textarea></label><div style="margin-top:10px"><button class="ghost" id="cp">Скопировать</button></div>' +
      '<p class="mute" style="margin-top:10px">Код подходит только к этому черновику. Отправьте его родителю в ответном письме.</p></div></div>';
  });

  out.addEventListener('click', function (e) {
    if (e.target.id === 'mk') {
      var l1 = document.getElementById('l1').value.trim();
      if (!l1) { document.getElementById('l1').focus(); return; }
      var d = new Date();
      var code = C.packOpen(P.pid, { l: [l1, document.getElementById('l2').value.trim()].filter(Boolean), v: document.getElementById('vec').value.trim(), n: document.getElementById('nt').value.trim(), d: d.toISOString().slice(0, 10) });
      document.getElementById('oc').value = code;
      document.getElementById('res').hidden = false;
    }
    if (e.target.id === 'cp') {
      var el = document.getElementById('oc'); el.select();
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(el.value); } else { document.execCommand('copy'); }
      e.target.textContent = 'Скопировано';
    }
  });
})();
</script>
</body>
</html>
